<!DOCTYPE html>
<html>
   <head>
      <meta http-equiv="content-type" content="text/html;charset=UTF-8" />
      <meta charset="utf-8" />
      <title>QFI</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
      <link rel="preconnect" href="https://fonts.gstatic.com">
      <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
      <link class="main-stylesheet" href="css/bootstrap.css" rel="stylesheet" type="text/css" />
      <link class="main-stylesheet" href="css/bootstrap-select.css" rel="stylesheet" type="text/css" />
      <link class="main-stylesheet" href="css/jquery-ui.css" rel="stylesheet" type="text/css" />
      <link class="main-stylesheet" href="scss/style.css" rel="stylesheet" type="text/css" />
   </head>
   <body>
      <!-- loader html start -->
      <div id="preloader">
         <div class="loader-inner-wrapper">
            <img class="loader-icon" src="images/ic-loader.svg" alt=""/>
         </div>
      </div>
      <!-- loader html close -->
      <!-- <div class="content-wrapper"> -->
        <div class="onboarding-main-block">
            <div class="onboarding-block">
                <div class="onboarding-content text-center">
                    <a href="javascript:;" class="logo mb-4 d-block"><img src="images/logo.svg" alt="" /></a>
                    <h2 class="h2">Log in to your account</h2>
                    <p class="p">Welcome back! Please enter your details.</p>
                </div>
                <div class="onboarding-form-wrpr">
                    <form>
                        <div class="form-group">
                            <label for="exampleInputEmail1">Email address</label>
                            <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
                                placeholder="Enter email">
                        </div>
                        <div class="form-group">
                            <label for="exampleInputPassword1">Password</label>
                            <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Password">
                        </div>
                        <div class="d-flex align-items-center justify-content-between mb-3 forgot-link-wrpr">
                            <div class="form-group mb-0">
                                <div class="checkbox-blk">
                                <input type="checkbox" name="listbox">
                                <span class="checkbox-icon"></span>
                                <label>Remember Me</label>
                                </div>
                            </div>
                            <a href="forgot-password.html" class="forget-link">Forgot password</a>
                        </div>
                        <button type="submit" class="primary-btn justify-content-center w-100">Submit</button>
                    </form>
                    <div class="social-btn">
                        <button type="button" class="login-btn outline-btn" >
                            <span class="google-icon"></span>
                            Sign in with Google
                          </button>
                          <button type="button" class="login-btn outline-btn" >
                            <span class="apple-icon"></span>
                            Sign up with Apple
                          </button>
                    </div>
                    <p class="text-center mt-3">Don’t have an account? <a href="sign-up.html" class="btn-link">Sign up</a></p>
                </div>
            </div>
        </div>
      <!-- </div> -->

   </body>
   <script src="js/jquery-3.3.1.min.js" type="text/javascript"></script>
   <script src="js/jquery-ui.js" type="text/javascript"></script>
   <script src="js/popper.min.js" type="text/javascript"></script>
   <script src="js/bootstrap.js" type="text/javascript"></script>
   <script src="js/bootstrap-select.min.js" type="text/javascript"></script>
   <script src="js/tinymce-editor.min.js" type="text/javascript"></script>
   <script src="js/custom.js" type="text/javascript"></script>
</html>
